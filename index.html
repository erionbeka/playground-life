<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf8f4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
  <title>Playground Life</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fdf8f4;
    }
    body { overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #root { min-height: 100vh; min-height: 100dvh; }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fdf8f4;
      opacity: 1;
      transition: opacity 350ms ease-out;
    }
    #app-splash iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fdf8f4;
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <iframe
      src="/playground_life_splash_screen.html"
      title="Playground Life loading screen"
    ></iframe>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script src="/register-sw.js" defer></script>
</body>
</html>
