services:
  postgres:
    image: postgres:16-alpine
    container_name: playground-life-postgres
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground_life
    ports:
      - "5432:5432"
    volumes:
      - playground_life_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground_life"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  playground_life_pgdata:
