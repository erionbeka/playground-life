name: Production Readiness

on:
  push:
    branches: [main, fix/security-backup-regressions]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: playground_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d playground_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/playground_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/playground_test
      JWT_SECRET: ci-only-test-secret-do-not-use-in-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck API
        run: npm run typecheck:server

      - name: Build web app
        run: npm run build

      - name: Install browser for visual and E2E tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npx playwright test

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
