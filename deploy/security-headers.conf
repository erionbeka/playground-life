# Security headers for the app's own responses.
#
# Nginx does not merge `add_header` directives across levels. A location that
# sets its own `add_header` loses every header set higher up, so a header
# written only at the server level silently disappears for the HTML shell and
# for the hashed assets. The headers therefore live in this file and every
# location that sets a header of its own includes it.
#
# The policy allows styles from Google Fonts, which index.html loads, and
# connections to any https origin, because the API may be served from a
# different origin than the app (see VITE_API_URL in the deployment runbook).
# Scripts are restricted to the app's own origin.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
